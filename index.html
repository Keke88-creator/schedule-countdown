<!DOCTYPE html>

<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スケジュールカウントダウン</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>スケジュールカウントダウン</h1>
  <p>大切な日まで、あと何日？</p>

  <div class="schedule-card">

    <div class="schedule-info">
      <h2>🎓 卒業式</h2>
      <p>2027年3月15日</p>
    </div>

    <div class="countdown">
      <span>あと</span>
      <strong>148日</strong>
    </div>

  </div>

  <button>＋ 予定を追加する</button>

</body>
  
</html>
